<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GestoTips</title>
<link rel="icon" type="image/png" href="./icon.png?v=1.13.0">
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=1.13.0">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<style>/* Colors de totes les apps Gesto, en mode clar i fosc (ESTIL.md, «Colors i tipografia»).
   Font única: si canvies un color aquí, canvia a totes les apps. */
:root{color-scheme:light;--bg:#f7f8fd;--tx:#28377e;--mu:#566598;--ln:#303f91;--surface:#fff;--soft:#f0f2fc;--border:#d4daf1;--field:#b6bfdf;--on:#fff;--red:#b42318;--green:#17734a}
:root[data-theme=dark]{color-scheme:dark;--bg:#10152c;--tx:#e5e9ff;--mu:#adb8e5;--ln:#a1afff;--surface:#1b2447;--soft:#232f59;--border:#425080;--field:#6371a0;--on:#10152c;--red:#ff9992;--green:#84dbab}
:root{--main-bg:#eaf0ff;--main-border:#afbfeb}
:root[data-theme=dark]{--main-bg:#202e55;--main-border:#516798}

/* Estil de base de les apps Gesto (ESTIL.md): tipografia, targetes, camps, botons, llistes, fitxes, inici de sessió.
   El fan servir GestoCatalog, GestoTips i GestoAdmin. Va després de colors.css i abans de l'estil propi de cada app. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:20px 16px 36px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}
h1{font-size:28px;letter-spacing:-.035em;margin:0}
h2{font-size:21px;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
p{margin:8px 0}
nav,.actions{display:flex;gap:8px;flex-wrap:wrap}
nav{margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 14px rgba(40,55,126,.055);padding:20px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
input,select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1px solid var(--field);border-radius:10px;background:var(--surface);color:var(--tx);font:inherit;font-size:16px}
textarea{display:block;resize:vertical;margin:10px 0}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 inherit;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
button:hover,.button:hover{background:var(--soft)}
.primary,[aria-current=page]{background:var(--ln);color:var(--on)}
.primary:hover,[aria-current=page]:hover{background:var(--ln);filter:brightness(1.13)}
:focus-visible{outline:3px solid #788cf0;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item{border-top:1px solid var(--border);padding:8px 0}
.item:last-child{padding-bottom:0}
.meta{color:var(--mu);font-size:14px}
.error,.remove{color:var(--red)}
@media(max-width:430px){main{padding:14px 12px 28px}.card{padding:15px}h1{font-size:24px}nav button{padding:8px 11px}}
[hidden]{display:none !important}
main{width:100%;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
.card,.grid,.grid>* ,label,.row>*{min-width:0}
input,select,textarea,button,.button{max-width:100%;min-width:0}
input[type=file]{width:100%}
img,video,canvas{max-width:100%;height:auto}
.card{overflow-wrap:anywhere}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
#login-panel{max-width:500px;margin-inline:auto}
#login-form .grid{grid-template-columns:minmax(0,1fr)}
.login-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#password-reset{display:inline-block;margin:12px 0;color:var(--tx);text-underline-offset:.18em}
#login-status:empty{display:none}
@media(max-width:480px){
  html{-webkit-text-size-adjust:100%}
  button,.button{touch-action:manipulation}
}
/* Requadre principal de cada pantalla */
.main-card{background:var(--main-bg);border-color:var(--main-border)}
.main-card .card{background:var(--surface);box-shadow:none;border-radius:14px;padding:16px;margin:12px 0 0}
.main-card .card h3:first-child{margin-top:0}
.main-card .card h2{font-size:17px;margin:0 0 10px}
.main-card>.card:first-of-type{margin-top:14px}
/* Fitxes (diàlegs): <dialog class="sheet-dialog"> amb .sheet-head (títol i ✕), .sheet-part i .sheet-foot */
dialog.sheet-dialog{width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);padding:18px;color:var(--tx);background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:auto}
dialog.sheet-dialog::backdrop{background:#11183180}
.sheet-close{min-width:0;width:40px;min-height:40px;padding:0;font-size:18px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0}
.sheet-part{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
.sheet-part h3{margin:0 0 8px}
.sheet-foot{border-top:1px solid var(--border);margin-top:14px;padding-top:12px}
/* Botons d'icona (llapis, impressora…) */
.icon-button{min-width:0;width:36px;min-height:36px;padding:0}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-button.remove{border-color:var(--red)}
.icon-button:disabled{opacity:.35}



.tip-day{border-top:1px solid var(--border);padding:2px 0}
.tip-day>summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:2px 4px}
.tip-day>summary:hover{background:var(--soft);border-radius:8px}
.tip-day[open]{padding-bottom:8px}
.tip-day>summary strong:first-letter{text-transform:uppercase}
.tip-day>summary::before{content:"+";font-weight:700}
.tip-day[open]>summary::before{content:"−"}
.tip-day>summary>strong{flex:1}
.opening{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.opening input{width:20px;min-height:20px;margin:0}
.assignment{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px, 125px);align-items:center;gap:6px;margin:0;padding:2px 0}
.assignment input{min-height:40px;height:40px}
.points-control{display:grid;grid-template-columns:minmax(0,1fr) 40px;align-items:stretch}
.points-control input{padding-inline:8px;border-radius:10px 0 0 10px}
.point-arrows{display:grid;grid-template-rows:repeat(2,minmax(25px,1fr))}
.point-arrows button{min-height:0;padding:0;border-color:var(--field);border-left:0;border-radius:0 10px 0 0;line-height:1;touch-action:manipulation}
.point-arrows button+button{border-top:0;border-radius:0 0 10px 0}
.worker-state{display:block;color:var(--mu);font-size:14px}
.worker-state.is-active{color:var(--green)}
.add-worker{margin-top:6px}
.result-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.result-meta div{background:var(--soft);padding:10px 12px;border-radius:10px;display:grid}
.result-meta span{color:var(--mu);font-size:14px}
.result-meta strong{font-size:22px;font-variant-numeric:tabular-nums}
.payout-list{padding:0;list-style:none}
.payout-list li{display:grid;grid-template-columns:minmax(0,1fr) auto 6.5rem;gap:8px;padding:4px 0;white-space:nowrap;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.payout-list li strong{text-align:right}
.worker-form{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;margin-bottom:12px}
.history-day{font-size:14px;padding:4px 0;border-top:1px solid var(--border)}
.history-day p{margin:3px 0}

[data-history-year][aria-pressed=true]{background:var(--ln);color:var(--on)}
.annual-totals{list-style:none;padding:0;margin:0 0 20px}
.annual-totals li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid var(--border)}

@media(max-width:480px){
  .period-fields{grid-template-columns:minmax(0,1fr)}
  .period-fields input{display:block;width:100%;min-width:0;max-width:100%;height:48px}
  input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;height:46px;line-height:1.2;text-align:left}
  input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
  input[type="date"]::-webkit-datetime-edit{padding:0}
}
.history-totals{margin-top:20px}

.worker-profiles .worker-profile-item{border-top:1px solid var(--border);padding:10px 0}
.worker-profile-item>summary,.worker-profile-inactive>summary{cursor:pointer;min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.worker-profile-item>summary::before,.worker-profile-inactive>summary::before{content:"+"}
.worker-profile-item[open]>summary::before,.worker-profile-inactive[open]>summary::before{content:"−"}
.worker-profile-item>summary strong,.worker-profile-inactive>summary strong{flex:1}
.worker-profile-item>summary span,.worker-profile-inactive>summary span{color:var(--muted,var(--mu));font-size:14px}
.worker-profile{padding:12px 0 4px}
.worker-profile-fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:12px}
.worker-profile-option{display:flex;align-items:center;gap:8px;margin:10px 0}
.worker-profile-option input{width:20px;height:20px;min-height:20px;margin:0;flex:none}
.worker-profiles h3{margin-top:14px}

.worker-contact-actions{margin-bottom:8px}
.worker-contact-actions label{position:relative;cursor:pointer}
.worker-contact-actions input{position:absolute;inset:0;opacity:0;cursor:pointer}
.worker-contact-actions label:focus-within{outline:3px solid #788cf0;outline-offset:2px}
[data-worker-contact-options] label{margin-bottom:8px}

.worker-contact-actions:empty{display:none}
/* Aspecte comú de les apps Gesto: requadre principal amb fons blau clar (com «Nova comanda») i blocs blancs a dins. */

/* Avisos flotants comuns de les apps Gesto (vegeu ESTIL.md → Avisos i errors). */
#status:empty{display:none}
#status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1000;width:max-content;max-width:min(600px,calc(100% - 24px));margin:0;padding:12px 16px;border-radius:12px;background:var(--surface);color:var(--tx);border:1px solid var(--border);box-shadow:0 8px 28px #11183140;font-weight:600;cursor:pointer}
#status.error{color:var(--red);border-color:var(--red)}
/* Camps obligatoris: asterisc vermell al costat del nom (vegeu ESTIL.md → Camps obligatoris). */
.req-mark::after{content:"*";content:"*" / "";margin-left:3px;color:var(--red);font-weight:700}
label.req-mark{grid-auto-flow:column;justify-content:start;align-items:baseline}
label.req-mark::after{margin-left:0}

/* Lliscar (ESTIL.md): cap a l'esquerra elimina (vermell); cap a la dreta arxiva o recupera (blau) */
.swipe{position:relative;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.swipe>.swipe-bg{position:absolute;inset:0;display:none;align-items:center;padding:0 18px;color:var(--on)}
.swipe.left>.swipe-bg{display:flex;justify-content:flex-end;background:var(--red)}
.swipe.right>.swipe-bg{display:flex;justify-content:flex-start;background:var(--ln)}
.swipe>.swipe-bg svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.swipe>.swipe-row{position:relative}
#status .undo-button{min-height:32px;margin-inline-start:10px;padding:4px 12px;font-size:14px}
/* Paperera */
.trash-list{margin-top:10px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.trash-list>.meta{padding:12px;margin:0}
.trash-row{display:flex;flex-direction:column;gap:2px;padding:10px 12px;min-height:44px;justify-content:center}
.swipe+.swipe>.trash-row{border-top:1px solid var(--border)}
.trash-row strong,.trash-row .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Capçalera comuna de les apps Gesto: nom, versió, ☰ Menú i ↪︎ Sortir (ESTIL.md, «Capçalera de l'app» i «Menú»).
   Font única: si canvies alguna cosa aquí, canvia a totes les apps. Va després del CSS de cada app. */
.topbar{display:flex;align-items:center;justify-content:space-between;position:relative;gap:12px;margin:0 0 18px;padding:0 0 10px;border:0}
.topbar .brand{min-width:0;flex:1;display:flex;align-items:center;gap:12px}
.topbar .brand-text{min-width:0}
/* Logo (GestoAdmin → Configuració): al costat del nom i la versió, de la seva mateixa alçada. */
.topbar .brand-logo{flex:none;width:clamp(42px,9vw,54px);height:clamp(42px,9vw,54px);object-fit:contain}
.topbar .brand-logo[hidden]{display:none}
.topbar .brand h1{margin:0;font-size:clamp(20px,4.5vw,30px);font-weight:700;letter-spacing:-.035em;line-height:1.1;overflow-wrap:anywhere;font-variant:normal}
.topbar .version{margin-top:5px;font-size:14px;color:var(--mu)}
.top-actions{display:flex;flex-shrink:0;gap:8px;align-items:center}
.top-actions>button,.top-actions>.menu-anchor>button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant:normal;white-space:nowrap;cursor:pointer;box-shadow:none}
.top-actions>button:hover,.top-actions>.menu-anchor>button:hover{background:var(--soft);color:var(--tx);box-shadow:none;filter:none}
.top-actions button span:first-child{font-size:18px;line-height:1}
.top-actions [hidden]{display:none!important}
.menu-anchor{position:relative}
#menu-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:30;display:block;width:max-content;min-width:200px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 30px rgba(40,55,126,.15);padding:10px}
#menu-panel[hidden]{display:none}
#menu-panel #tabs{display:grid;gap:6px;margin:0 0 6px}
#menu-panel #tabs:empty{display:none}
#menu-panel button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:44px;margin:0;padding:9px 15px;border:1px solid var(--ln);border-radius:10px;background:var(--surface);color:var(--tx);font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant:normal;text-align:left;white-space:nowrap;cursor:pointer;box-shadow:none}
#menu-panel button:hover{background:var(--soft);color:var(--tx);box-shadow:none;filter:none}
#menu-panel button[aria-current=page],#menu-panel button.on{background:var(--ln);color:var(--on)}
#menu-panel button[aria-current=page]:hover,#menu-panel button.on:hover{background:var(--ln);color:var(--on);filter:brightness(1.13)}
@media(max-width:430px){
  .top-actions>button,.top-actions>.menu-anchor>button{font-size:14px;padding:7px 9px}
  .topbar .version{font-size:13px}
  .topbar .brand{gap:9px}
}
/* Mòbil: només les icones, sense vora ni fons; el menú s'ancora a la capçalera. */
@media(max-width:480px){
  .topbar{align-items:flex-start;gap:8px;margin-bottom:8px;padding-bottom:4px}
  .top-actions{gap:4px}
  .top-actions #menu-toggle,.top-actions #logout{width:44px;min-height:44px;padding:0;border-color:transparent;background:transparent}
  .top-actions .top-action-label{display:none}
  .menu-anchor{position:static}
  #menu-panel{top:100%;right:0}
}
.topbar .entorn-proves{color:var(--red);letter-spacing:.04em}
</style>
<link rel="manifest" href="./manifest.webmanifest">
</head>

<script type="module">
// Capçalera comuna de les apps Gesto: menú ☰ i mode fosc (ESTIL.md, «Capçalera de l'app» i «Menú»).
// Font única per a GestoCatalog, GestoTips, GestoAdmin, GestoStock i GestoTimer. L'HTML el genera shared/header.mjs.
// gestoHeader() es pot cridar diverses vegades: només prepara els botons la primera.
function gestoHeader() {
  if (gestoHeader.ready) return gestoHeader.ready;
  const toggle = document.getElementById('menu-toggle');
  const panel = document.getElementById('menu-panel');
  const theme = document.getElementById('theme');
  function setMenu(open) {
    panel.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
  }
  toggle.addEventListener('click', event => {
    event.stopPropagation();
    setMenu(panel.hidden);
  });
  // Es tanca en tocar fora, amb Esc o en triar una secció.
  document.addEventListener('click', event => {
    if (!panel.hidden && !event.target.closest('.menu-anchor')) setMenu(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || panel.hidden) return;
    setMenu(false);
    toggle.focus();
  });
  panel.addEventListener('click', event => {
    if (event.target.closest('#tabs button')) setMenu(false);
  });
  // Mode fosc: clau `theme` del navegador, comuna a totes les apps (mateix domini).
  // El <head> ja l'aplica abans de pintar la pàgina; aquí només s'actualitza el botó.
  function setTheme(dark) {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    theme.textContent = dark ? 'Mode clar' : 'Mode fosc';
    theme.setAttribute('aria-pressed', String(dark));
  }
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch {}
  setTheme(saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);
  theme.addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme !== 'dark';

// Stored values are measured in quarter points, including older repartiments.
const pointScale = 250000;
const maxUnits = 3999999.999996;
const validUnits = units => typeof units === 'number' && units >= 0 && units <= maxUnits &&
  Math.round(units * pointScale) / pointScale === units;
const dayMs = 86400000;
const dayOf = date => new Date(date + 'T00:00:00Z');
const isoDay = date => date.toISOString().slice(0, 10);
const shiftDay = (date, count) => isoDay(new Date(+dayOf(date) + count * dayMs));
const validDay = date => typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)
  && Number.isFinite(+dayOf(date)) && isoDay(dayOf(date)) === date;
const weekday = date => dayOf(date).getUTCDay();

function distribute(cents, days) {
  const totals = new Map();
  for (const day of days) {
    if (!day.open) continue;
    for (const {id, units} of day.entries) {
      const scaled = BigInt(Math.round((units ?? 0) * pointScale));
      totals.set(id, (totals.get(id) ?? 0n) + scaled);
    }
  }
  const units = [...totals.values()].reduce((sum, value) => sum + value, 0n);
  const payouts = [...totals].map(([id, points]) => {
    const product = BigInt(cents) * points;
    return {id, units: Number(points) / pointScale, cents: units ? Number(product / units) : 0,
      remainder: units ? product % units : 0n};
  });
  payouts.sort((a, b) => a.remainder === b.remainder ? (a.id < b.id ? -1 : 1) : (a.remainder > b.remainder ? -1 : 1));
  if (units) {
    const remaining = cents - payouts.reduce((sum, row) => sum + row.cents, 0);
    for (let index = 0; index < remaining; index++) payouts[index].cents++;
  }
  return {units: Number(units) / pointScale, payouts: payouts.map(({remainder, ...row}) => row)};
}

const sundayOnOrAfter = date => shiftDay(date,(7-weekday(date))%7);
const periodLength = (start,date) => (+dayOf(date)-+dayOf(start))/dayMs+1;

function validPeriodRange(start, date, previousDate) {
  return validDay(start) && validDay(date) && start <= date &&
    (!previousDate || start > previousDate) && periodLength(start,date) <= 366;
}

function defaultPeriodDates(today, previousDate) {
  const upcoming = sundayOnOrAfter(today);
  if (!previousDate) return {start:shiftDay(upcoming,-6),date:upcoming};
  const start = shiftDay(previousDate,1);
  const date = upcoming >= start && periodLength(start,upcoming) <= 366 ? upcoming : sundayOnOrAfter(start);
  return {start,date};
}

function periodDays(date, previous, workers, start = previous ? shiftDay(previous.date,1) : shiftDay(date,-6)) {
  const template = new Map(previous?.days.map(day => [weekday(day.date), day]));
  const active = new Set(workers.filter(worker => worker.active).map(worker => worker.id));
  const days = [];
  for (let current = start; current <= date; current = shiftDay(current, 1)) {
    const source = template.get(weekday(current));
    days.push({date: current, open: source?.open ?? false,
      entries: (source?.entries ?? []).filter(row => active.has(row.id)).map(({id, units}) => ({id, units}))});
  }
  return days;
}

function suggestedPoints(id, date, days, periods) {
  const earlier = [...days, ...periods.flatMap(period => period.days)]
    .filter(day => day.open && day.date < date);
  let match;
  let previous;
  for (const day of earlier) {
    const units = day.entries.find(row => row.id === id)?.units;
    if (!validUnits(units)) continue;
    if (day.date === shiftDay(date, -1)) previous = units;
    if (units > 0 && weekday(day.date) === weekday(date) && (!match || day.date > match.date)) {
      match = {date:day.date, units};
    }
  }
  return {matching:match?.units, previous};
}

function parseCents(text) {
  const match = /^(\d{1,7})(?:[.,](\d{1,2}))?$/.exec(text.trim());
  return match ? Number(match[1]) * 100 + Number((match[2] ?? '').padEnd(2, '0')) : null;
}

function whatsappPhone(value) {
  const text = String(value || '').trim();
  if (!/^\+?[\d\s().-]+$/.test(text)) return '';
  const digits = text.replace(/\D/g,'');
  if (digits.startsWith('00')) return whatsappPhone('+'+digits.slice(2));
  if (!text.startsWith('+') && /^[6789]\d{8}$/.test(digits)) return '34'+digits;
  return /^[1-9]\d{7,14}$/.test(digits) ? digits : '';
}

function vCardContact(text) {
  const entries = text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
  if (entries.filter(line => /^BEGIN:VCARD$/i.test(line.trim())).length !== 1) return null;
  const values = field => entries.filter(line =>
    new RegExp('^(?:[\\w-]+\\.)?'+field+'(?:;[^:]*)?:','i').test(line)
  ).map(line => line.slice(line.indexOf(':')+1)
    .replace(/\\[nN]/g,' ').replace(/\\([,;\\])/g,'$1').trim()).filter(Boolean);
  return {
    name:values('FN')[0] ?? '',
    tel:values('TEL').map(value => value.replace(/^tel:/i,'')),
    email:values('EMAIL').map(value => value.replace(/^mailto:/i,'')),
    uid:values('UID')[0] ?? ''
  };
}

function isMobileContactDevice() {
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
}

function workerContactFromShortcut(text) {
  const [header,...lines] = text.trim().split(/\r?\n/);
  if (header !== 'NEXA-CONTACTE') return null;
  const values = new Map();
  let field;
  for (const line of lines) {
    const match = /^(nom|correu|telèfon)\s*:\s*(.*)$/iu.exec(line);
    if (match) {
      field = match[1].toLocaleLowerCase('ca');
      values.set(field,[match[2]]);
    } else if (field && line.trim()) {
      values.get(field).push(line.trim());
    }
  }
  const name = (values.get('nom') ?? []).filter(Boolean).join(' ').trim();
  const email = (values.get('correu') ?? []).map(value => value.trim()).filter(Boolean);
  const tel = (values.get('telèfon') ?? []).map(value => value.trim()).filter(Boolean);
  return name || email.length || tel.length ? {name, email, tel} : null;
}

function bindWorkerContacts(container) {
  const contactsByForm = new WeakMap();

  function updateContactStatus(form, text) {
    const status = form.querySelector('[data-worker-contact-status]');
    status.textContent = text;
    status.hidden = !text;
  }

  function setWorkerContactField(form, field, value) {
    const fields = form.elements;
    // Només a la fitxa antiga de GestoTips: a GestoAdmin els permisos es revisen a mà.
    if (!('workerProfile' in form.dataset)) return false;
    if (field === 'email' && value.toLowerCase() !== fields.email.value.trim().toLowerCase() && fields.tipsView.checked) {
      fields.tipsView.checked = false;
      return true;
    }
    return false;
  }

  function fillWorkerContact(form, contact) {
    const fields = form.elements;
    if (contact.name && !(form.dataset.workerProfile || form.dataset.user)) fields.name.value = contact.name.trim().slice(0,80);
    const groups = [
      ['email','Correu',contact.email || [],254],
      ['phone','Telèfon',contact.tel || [],48]
    ];
    const choices = document.createDocumentFragment();
    let reviewAccess = false;
    for (const [field,label,values,limit] of groups) {
      const options = [...new Set(values.map(value => value.trim().slice(0,limit)).filter(Boolean))];
      if (options.length === 1) {
        if (setWorkerContactField(form,field,options[0])) reviewAccess = true;
        fields[field].value = options[0];
      }
      if (options.length < 2) continue;
      const select = document.createElement('select');
      select.dataset.workerContactField = field;
      select.add(new Option('Tria '+label.toLowerCase(),''));
      for (const value of options) select.add(new Option(value,value));
      const wrapper = document.createElement('label');
      wrapper.append(label+' del contacte',select);
      choices.append(wrapper);
    }
    const panel = form.querySelector('[data-worker-contact-options]');
    panel.querySelectorAll('label:has([data-worker-contact-field])').forEach(label => label.remove());
    panel.append(choices);
    fields.contactName.value = (contact.name || contact.email?.[0] || contact.tel?.[0] || '').slice(0,160);
    fields.contactUid.value = contact.uid ?? '';
    updateContactStatus(form,'Revisa les dades del contacte i desa la fitxa.'+
      (reviewAccess ? ' Revisa si vols autoritzar el correu nou a GestoTips.' : ''));
  }

  container.addEventListener('click',async event => {
    const applyPaste = event.target.closest('[data-worker-apply-paste]');
    if (applyPaste) {
      const form = applyPaste.form;
      const input = form.querySelector('[data-worker-contact-paste]');
      const contact = workerContactFromShortcut(input.value) ?? vCardContact(input.value.trim());
      if (!contact || !(contact.name || contact.email.length || contact.tel.length)) {
        updateContactStatus(form,'Enganxa el contacte copiat per la drecera Nexa Contacte 2.');
        return;
      }
      fillWorkerContact(form,contact);
      if (workerContactFromShortcut(input.value)) markWorkerShortcutReady();
      input.value = '';
      form.querySelector('[data-worker-ios-panel]').open = false;
      return;
    }
    const picker = event.target.closest('[data-worker-contact]');
    if (!picker) return;
    const {form} = picker;
    try {
      const [contact] = await navigator.contacts.select(['name','email','tel'],{multiple:false});
      if (!contact || !form.isConnected) return;
      form.querySelector('[data-worker-contact-options]').replaceChildren();
      fillWorkerContact(form,{...contact,name:contact.name?.[0]});
    } catch (error) {
      if (form.isConnected && error.name !== 'AbortError') updateContactStatus(form,'No s’ha pogut obrir l’agenda. Pots escriure les dades al formulari.');
    }
  });

  container.addEventListener('change',async event => {
    const input = event.target;
    if (input.matches('[data-worker-contact-field]') && input.value) {
      const field = input.dataset.workerContactField;
      if (setWorkerContactField(input.form,field,input.value))
        updateContactStatus(input.form,'Revisa si vols autoritzar el correu nou a GestoTips abans de desar.');
      input.form.elements[field].value = input.value;
    } else if (input.matches('[data-worker-contact-choice]') && input.value) {
      const contact = contactsByForm.get(input.form)?.[Number(input.value)];
      if (contact) fillWorkerContact(input.form,contact);
    } else if (input.matches('[data-worker-vcard]') && input.files[0]) {
      const {form} = input;
      try {
        const file = input.files[0];
        if (file.size > 8*1024*1024) throw new Error();
        const text = await file.text();
        if (!form.isConnected) return;
        const contacts = (text.match(/^[ \t]*BEGIN:VCARD[ \t]*\r?$[\s\S]*?^[ \t]*END:VCARD[ \t]*\r?$/gim) || [])
          .map(vCardContact).filter(contact => contact && (contact.name || contact.email.length || contact.tel.length));
        if (!contacts.length) throw new Error();
        const panel = form.querySelector('[data-worker-contact-options]');
        panel.replaceChildren();
        if (contacts.length === 1) {
          fillWorkerContact(form,contacts[0]);
          return;
        }
        contactsByForm.set(form,contacts);
        const select = document.createElement('select');
        select.dataset.workerContactChoice = '';
        select.add(new Option('Tria una persona',''));
        contacts.forEach((contact,index) => select.add(new Option(
          [contact.name,contact.email[0]].filter(Boolean).join(' · ') || contact.tel[0],String(index))));
        const label = document.createElement('label');
        label.append('Contacte de l’agenda',select);
        panel.append(label);
        select.focus();
        updateContactStatus(form,'Tria la persona que vols associar.');
      } catch {
        if (form.isConnected) updateContactStatus(form,'Tria un fitxer .vcf vàlid de fins a 8 MB.');
      } finally {
        input.value = '';
      }
    }
  });
}

// Avisos flotants comuns de les apps Gesto (vegeu ESTIL.md → Avisos i errors). Els fan servir GestoCatalog, GestoTips, GestoAdmin i GestoStock.
// Funciona sobre l'element #status: els d'èxit marxen sols als 6 segons; els d'error (classe .error) i els importants (classe .keep) es queden fins que es premen.
// Si hi ha un <dialog> obert, l'avís s'hi mou perquè no quedi tapat. Els camps obligatoris buits avisen aquí, sense la bombolla del navegador.
// Camps obligatoris (ESTIL.md → Camps obligatoris): tot camp amb `required` rep sol un asterisc vermell (.req-mark) al costat del seu nom.

// Etiqueta d'un camp: la <label> que l'envolta, la <label for> o la que té just abans.
function fieldLabel(field) {
  const previous = field.previousElementSibling;
  return field.closest('label') || (field.id && document.querySelector('label[for="'+CSS.escape(field.id)+'"]')) || (previous?.tagName === 'LABEL' ? previous : null);
}
// Text del nom del camp.
function fieldLabelText(field) {
  const label = fieldLabel(field);
  if (!label) return '';
  return (label.contains(field) ? label.childNodes[0]?.textContent : label.textContent)?.trim() || '';
}
// On va l'asterisc: l'etiqueta mateixa o, si envolta el camp, el text del nom (dins d'un <span>), perquè surti just al costat.
function requiredMarkTarget(label) {
  const fields = 'input,select,textarea';
  if (!label.querySelector(fields)) return label;
  for (const node of label.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (!node.textContent.trim()) continue;
      const name = document.createElement('span');
      name.dataset.reqWrap = '1';
      node.before(name);
      name.append(node);
      return name;
    }
    if (node.nodeType !== Node.ELEMENT_NODE || node.matches(fields) || node.querySelector(fields)) return null;
    return node;
  }
  return null;
}
// Posa o treu l'asterisc (classe .req-mark) segons quins camps són obligatoris ara mateix (també els que canvien o apareixen després).
function markRequiredFields() {
  const labels = new Set();
  for (const field of document.querySelectorAll('input:required:not(:disabled),select:required:not(:disabled),textarea:required:not(:disabled)')) {
    const label = fieldLabel(field);
    if (label) labels.add(label);
  }
  for (const mark of document.querySelectorAll('.req-mark')) {
    if (labels.has(mark.closest('label'))) continue;
    mark.classList.remove('req-mark');
    if (mark.dataset.reqWrap) mark.replaceWith(...mark.childNodes);
  }
  for (const label of labels) {
    if (label.classList.contains('req-mark') || label.querySelector('.req-mark')) continue;
    requiredMarkTarget(label)?.classList.add('req-mark');
  }
}
function setupRequiredMarks() {
  if (document.documentElement.dataset.requiredMarks) return;
  document.documentElement.dataset.requiredMarks = '1';
  let queued = false;
  const update = () => {
    if (queued) return;
    queued = true;
    queueMicrotask(() => { queued = false; markRequiredFields(); });
  };
  new MutationObserver(update).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['required','disabled']});
  update();
}
setupRequiredMarks();

function setupNotices() {
  const status = document.querySelector('#status');
  if (!status || status.dataset.notices) return;
  status.dataset.notices = '1';
  let timer = 0;
  // Lloc habitual de l'avís: #workspace (o el <body> si l'app no en té).
  const home = () => document.querySelector('#workspace') || document.body;
  const place = () => {
    const parent = document.querySelector('dialog[open]') || home();
    if (status.parentElement !== parent) parent.append(status);
  };
  new MutationObserver(() => {
    clearTimeout(timer);
    const stays = status.classList.contains('error') || status.classList.contains('keep');
    const title = status.textContent.trim() && stays ? 'Prem per tancar l’avís' : '';
    if (status.title !== title) status.title = title;
    if (!status.textContent.trim()) return;
    place();
    if (!stays && status.textContent !== 'Desant…') timer = setTimeout(() => { status.textContent = ''; },6000);
  }).observe(status,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']});
  status.addEventListener('click',event => { if (!event.target.closest('[data-undo]')) status.textContent = ''; });
  document.addEventListener('close',() => {
    if (status.parentElement !== home()) home().append(status);
  },true);
  let invalidShown = false;
  document.addEventListener('invalid',event => {
    event.preventDefault();
    if (invalidShown) return;
    invalidShown = true;
    setTimeout(() => { invalidShown = false; },0);
    const field = event.target;
    // Nom del camp: el de la seva etiqueta (sense l'asterisc); si no en té, aria-label o placeholder.
    const label = fieldLabelText(field) || field.getAttribute('aria-label') || field.placeholder || '';
    field.focus();
    status.classList.add('error');
    status.textContent = field.validity.valueMissing
      ? (field.tagName === 'SELECT' ? 'Tria una opció a «'+label+'».' : 'Omple el camp «'+label+'».')
      : (label ? 'Revisa el camp «'+label+'». ' : '')+field.validationMessage;
  },true);
}

// Lliscar per eliminar o arxivar i avís amb «Desfés» (ESTIL.md), comú a GestoCatalog, GestoTips, GestoAdmin i GestoStock.
// Fila lliscable: swipeOpen(clau, es pot eliminar, es pot arxivar/restaurar, icona de la dreta) + fila amb la classe «swipe-row» + '</div>'.
// setupSwipe(acció, ocupat): acció(clau, 'left'|'right') retorna (o promet) true si s'ha fet; si no, la fila torna al seu lloc.
const swipeIcons = {
  left:'<svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>',
  archive:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/><path d="M10 13h4"/></svg>',
  restore:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg>'
};
function swipeOpen(key, left, right, rightIcon = 'archive') {
  const attr = String(key).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  return '<div class="swipe" data-swipe="'+attr+'"'+(left ? ' data-left="1"' : '')+(right ? ' data-right="1" data-right-icon="'+rightIcon+'"' : '')+'><div class="swipe-bg" aria-hidden="true"></div>';
}
// Avís amb el botó «Desfés» (dura els 6 segons dels avisos d'èxit; si és d'error, es queda fins que es prem).
function showUndo(message, undo, error = false) {
  const status = document.querySelector('#status');
  status.classList.remove('keep');
  status.classList.toggle('error',error);
  status.textContent = message;
  if (!undo) return;
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'undo-button';
  button.dataset.undo = '';
  button.textContent = 'Desfés';
  button.addEventListener('click',() => { status.textContent = ''; undo(); },{once:true});
  status.append(' ',button);
}
function setupSwipe(action, isBusy = () => false) {
  let touch = null;
  let wheel = null;
  let quietUntil = 0;
  let blockClick = 0;
  function backgroundOf(element) {
    for (let node = element; node && node !== document.documentElement; node = node.parentElement) {
      const color = getComputedStyle(node).backgroundColor;
      if (color && color !== 'transparent' && color !== 'rgba(0, 0, 0, 0)') return color;
    }
    return getComputedStyle(document.body).backgroundColor;
  }
  function begin(wrap) {
    const row = wrap.querySelector('.swipe-row');
    if (getComputedStyle(row).backgroundColor === 'rgba(0, 0, 0, 0)') row.style.background = backgroundOf(wrap.parentElement);
    row.style.transition = 'none';
    return {wrap,row,dx:0,width:wrap.offsetWidth || 1};
  }
  function move(state, dx) {
    if (dx < 0 && !state.wrap.dataset.left) dx = 0;
    if (dx > 0 && !state.wrap.dataset.right) dx = 0;
    state.dx = dx;
    state.row.style.transform = dx ? 'translateX('+dx+'px)' : '';
    state.wrap.classList.toggle('left',dx < 0);
    state.wrap.classList.toggle('right',dx > 0);
    const side = dx < 0 ? 'l' : dx > 0 ? 'r' : '';
    const bg = state.wrap.firstElementChild;
    if (bg.dataset.icon !== side) {
      bg.dataset.icon = side;
      bg.innerHTML = side === 'l' ? swipeIcons.left : side === 'r' ? swipeIcons[state.wrap.dataset.rightIcon] || swipeIcons.archive : '';
    }
  }
  function reset(state) {
    state.row.style.transition = 'transform .2s';
    state.row.style.transform = '';
    setTimeout(() => { state.wrap.classList.remove('left','right'); state.row.style.background = ''; state.row.style.transition = ''; },200);
  }
  function end(state) {
    quietUntil = Date.now()+400;
    const dir = state.dx <= -state.width/2 ? 'left' : state.dx >= state.width/2 ? 'right' : '';
    if (!dir) { reset(state); return; }
    state.row.style.transition = 'transform .18s';
    state.row.style.transform = 'translateX('+(dir === 'left' ? -state.width : state.width)+'px)';
    setTimeout(async () => {
      let ok = false;
      try { ok = await action(state.wrap.dataset.swipe,dir); } catch { ok = false; }
      // Si no s'ha pogut fer, la fila torna al seu lloc; l'avís d'error n'explica el motiu.
      if (!ok && state.wrap.isConnected) reset(state);
    },180);
  }
  // Dit o ratolí: arrossegar la fila.
  document.addEventListener('pointerdown',event => {
    if (event.button > 0) return;
    const wrap = event.target.closest('.swipe');
    // Els camps i el que porta data-no-swipe (per exemple, la nansa per ordenar) no fan lliscar la fila.
    if (!wrap || event.target.closest('input,select,textarea,[data-no-swipe]')) return;
    touch = {wrap,x:event.clientX,y:event.clientY,id:event.pointerId,state:null};
  });
  document.addEventListener('pointermove',event => {
    if (!touch || event.pointerId !== touch.id) return;
    const dx = event.clientX-touch.x;
    const dy = event.clientY-touch.y;
    if (!touch.state) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) >= Math.abs(dx) || isBusy()) { touch = null; return; }
      touch.state = begin(touch.wrap);
      try { touch.wrap.setPointerCapture(event.pointerId); } catch { /* sense captura */ }
    }
    event.preventDefault();
    move(touch.state,dx);
  },{passive:false});
  function release(event) {
    if (!touch || event.pointerId !== touch.id) return;
    const state = touch.state;
    touch = null;
    if (!state) return;
    blockClick = Date.now();
    if (event.type === 'pointercancel') reset(state); else end(state);
  }
  document.addEventListener('pointerup',release);
  document.addEventListener('pointercancel',release);
  // Després d'arrossegar, no s'obre la fila.
  document.addEventListener('click',event => {
    if (Date.now()-blockClick < 400 && event.target.closest('.swipe')) { event.preventDefault(); event.stopImmediatePropagation(); }
  },true);
  // Trackpad: lliscar amb dos dits.
  document.addEventListener('wheel',event => {
    const wrap = event.target.closest('.swipe');
    if (!wheel) {
      if (!wrap || isBusy() || Date.now() < quietUntil || Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
      wheel = {wrap,state:begin(wrap),dx:0};
    } else if (wheel.wrap !== wrap && !wheel.wrap.contains(event.target)) return;
    event.preventDefault();
    wheel.dx -= event.deltaX;
    move(wheel.state,wheel.dx);
    clearTimeout(wheel.timer);
    wheel.timer = setTimeout(() => { const state = wheel.state; wheel = null; end(state); },120);
  },{passive:false});
}

const money = new Intl.NumberFormat('ca-ES', {style:'currency', currency:'EUR'});
const points = new Intl.NumberFormat('ca-ES', {maximumFractionDigits:6});
const dayLabel = new Intl.DateTimeFormat('ca-ES', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
const fullDate = new Intl.DateTimeFormat('ca-ES', {dateStyle:'long', timeZone:'UTC'});
const formatMoney = cents => money.format(cents / 100);
const formatPoints = units => points.format(units / 4);
const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const get = id => document.getElementById(id);

async function localRequest(body) {
  // Només en local: ?as=correu mostra l'app com la veuria aquest treballador.
  const as = new URLSearchParams(location.search).get('as');
  const headers = as ? {'X-Local-As':as} : {};
  const response = await fetch('/NexaTips/api', body ? {
    method:'POST', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify(body)
  } : {cache:'no-store',headers});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error);
  return data;
}

const tipsCollator = new Intl.Collator('ca', {sensitivity:'base'});
const madridToday = () => new Intl.DateTimeFormat('en-CA', {
  timeZone:'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit'
}).format(new Date());

function payoutSummary(rows, nameOf = () => '') {
  if (!rows.length) return '<p class="meta">Encara no hi ha punts assignats.</p>';
  return '<ul class="payout-list">'+rows.slice().sort((a,b) => (a.name ?? nameOf(a.id)).localeCompare(b.name ?? nameOf(b.id), 'ca')).map(row =>
    '<li><span>'+escapeHtml(row.name ?? nameOf(row.id))+'</span><span>'+formatPoints(row.units)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>'
  ).join('')+'</ul>';
}

// Històric (administradors i treballadors amb permís). source = {periods, annualTotals, workers}.
function renderTipsHistory(source, historyYear, today) {
  const collator = tipsCollator;
  const years = [...new Set([today.slice(0,4),...source.periods.map(period => period.date.slice(0,4))])].sort().reverse();
  if (!years.includes(historyYear)) historyYear = years[0];
  const periods = source.periods.filter(period => period.date.startsWith(historyYear+'-'));
  const names = new Map(periods.flatMap(period => period.payouts.map(row => [row.id,row.name])));
  const amounts = new Map(source.annualTotals.filter(row => row.year === historyYear).map(row => [row.worker_id,row.cents]));
  const workers = new Map(source.workers.map(row => [row.id,row.name]));
  for (const id of amounts.keys()) {
    if (!workers.has(id)) workers.set(id,names.get(id) || 'Treballador');
  }
  const totals = [...workers].map(([id,name]) => ({name,cents:amounts.get(id) ?? 0}))
    .sort((a,b) => collator.compare(a.name,b.name));
  const summary = rows => payoutSummary(rows,id => workers.get(id) ?? '');
  return {year:historyYear, html:'<section class="card main-card"><h2>Històric</h2><nav aria-label="Anys del repartiment">'+
    years.map(year => '<button type="button" data-history-year="'+year+'" aria-pressed="'+(year===historyYear)+'">'+year+'</button>').join('')+'</nav>'+
    '<h3>Repartiments</h3>'+
    (periods.length ? periods.map(period =>
      '<details class="tip-day"><summary><strong>'+fullDate.format(dayOf(period.date))+'</strong><span>'+formatMoney(period.cents)+'</span></summary>'+
      summary(period.payouts)+period.days.filter(day => day.open).map(day => '<div class="history-day"><strong>'+
        dayLabel.format(dayOf(day.date))+'</strong><p>'+day.entries.map(row => escapeHtml(row.name)+' · '+formatPoints(row.units)).join(', ')+'</p></div>').join('')+
      '</details>').join('') : '<p class="meta">Encara no hi ha repartiments tancats aquest any.</p>')+
    '<h3 class="history-totals">Total anual per treballador</h3>'+
    (totals.length ? '<ul class="annual-totals">'+totals.map(row => '<li><span>'+escapeHtml(row.name)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>').join('')+'</ul>'
      : '<p class="meta">Encara no hi ha propines tancades per a aquest any.</p>')+'</section>'};
}

// Menú i mode fosc per a tothom (administradors i treballadors): shared/header.js, comú a totes les apps Gesto.
function setupMenuAndTheme() {
  gestoHeader().showMenu();
}

function mountTipsViewer(request, initial) {
  const content = get('content');
  const status = get('status');
  const menu = get('menu-panel');
  const toggle = get('menu-toggle');
  const today = madridToday();
  let state = initial;
  let busy = false;
  let tab = initial.can?.view || initial.can?.pot ? 'period' : 'history';
  let historyYear;
  function renderTabs() {
    const can = state?.can ?? {};
    const list = [can.view || can.pot ? ['period','Repartiment'] : null, can.history ? ['history','Històric'] : null].filter(Boolean);
    get('tabs').innerHTML = list.length > 1 ? list.map(([key, label]) =>
      '<button type="button" data-tab="'+key+'" '+(tab === key ? 'aria-current="page"' : '')+'>'+label+'</button>').join('') : '';
  }
  function render(current) {
    const can = state?.can ?? {view:true, pot:true};
    renderTabs();
    if (tab === 'history' && state?.history) {
      const result = renderTipsHistory(state.history,historyYear,today);
      historyYear = result.year;
      content.innerHTML = result.html;
      return;
    }
    content.innerHTML = '<section class="card main-card"><h2>Repartiment actual</h2>'+
      (current ? '<p>'+fullDate.format(dayOf(current.date))+'</p>'+
        (can.pot ? '<form id="viewer-pot"><div class="grid"><label>Pot de propines (€)'+
        '<input name="amount" type="text" inputmode="decimal" maxlength="32" placeholder="0,00" required value="'+
        (current.cents === null ? '' : (current.cents/100).toFixed(2).replace('.',','))+'"></label></div>'+
        '<button class="primary">Desa el pot</button></form>' : '')+
        (!can.view ? '' : current.payouts.length ? '<ul class="payout-list">'+current.payouts.slice().sort((a,b) => a.name.localeCompare(b.name,'ca')).map(row =>
          '<li><span>'+escapeHtml(row.name)+'</span><span>'+formatPoints(row.units)+'</span><strong>'+formatMoney(row.cents)+'</strong></li>').join('')+'</ul>'
          : '<p class="meta">Els imports encara no estan disponibles.</p>')+
        (can.view ? current.days : []).map(day => '<div class="history-day"><strong>'+dayLabel.format(dayOf(day.date))+'</strong><p>'+
          day.entries.map(row => escapeHtml(row.name)+(row.units === null ? '' : ' · '+formatPoints(row.units))).join(', ')+'</p></div>').join('')
        : '<p class="meta">Encara no hi ha cap repartiment en curs.</p>')+
      '<button id="refresh-current" type="button">Actualitza</button></section>';
  }
  async function refresh() {
    if (busy) return;
    busy = true;
    try {
      state = await request();
      render(state.current);
      status.textContent = '';
    } catch (error) {
      render(null);
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      busy = false;
    }
  }
  content.addEventListener('submit',async event => {
    if (event.target.id !== 'viewer-pot') return;
    event.preventDefault();
    if (busy) return;
    const form = event.target;
    const amount = form.elements.amount.value;
    if (parseCents(amount) === null) {
      status.classList.add('error');
      status.textContent = 'Introdueix un import vàlid.';
      form.elements.amount.focus();
      return;
    }
    busy = true;
    const button = form.querySelector('button[type=submit],button');
    button.disabled = true;
    try {
      await request({action:'viewerPot',amount,date:state.current.date,revision:state.revision});
      status.classList.remove('error');
      status.textContent = 'Pot desat.';
      state = await request();
      render(state.current);
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      busy = false;
      button.disabled = false;
    }
  });
  content.addEventListener('click', event => {
    if (event.target.id === 'refresh-current') void refresh();
    const year = event.target.closest('[data-history-year]')?.dataset.historyYear;
    if (year) {
      historyYear = year;
      render(state.current);
    }
  });
  get('tabs').addEventListener('click', event => {
    const button = event.target.closest('[data-tab]');
    if (!button) return;
    tab = button.dataset.tab;
    menu.hidden = true;
    toggle.setAttribute('aria-expanded','false');
    render(state.current);
  });
  window.addEventListener('focus', () => {
    if (tab === 'period' && !content.querySelector('form:focus-within')) void refresh();
  });
  render(initial.current);
}

async function mountApp(request = localRequest, initial) {
  const content = get('content');
  const status = get('status');
  const menu = get('menu-panel');
  const toggle = get('menu-toggle');
  setupMenuAndTheme();
  let data;
  try {
    data = initial ?? await request();
  } catch {
    status.classList.add('error');
    status.textContent = 'No s’han pogut carregar les dades. Recarrega la pàgina.';
    return;
  }
  if (data.role === 'viewer') {
    mountTipsViewer(request,data);
    return;
  }
  const today = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit'
  }).format(new Date());
  // role 'points': treballador que pot marcar els punts (sense canviar dates, sense tancar i sense històric).
  const limited = data.role === 'points';
  const can = data.can ?? {view:true, pot:true, points:true};
  let tab = 'period';
  let historyYear;
  let date;
  let start;
  let days;
  let amount = '';
  let busy = false;
  let selectedDays;
  let revision = data.draft?.revision ?? 0;
  let pendingDraft;
  let savingDraft;
  const sync = get('sync-state');
  const latest = () => data.periods[0];
  const nameOf = id => data.workers.find(worker => worker.id === id)?.name ?? '';
  const collator = new Intl.Collator('ca', {sensitivity:'base'});
  const sortedWorkers = () => data.workers.slice().sort((a, b) => collator.compare(a.name, b.name));
  const activeWorkers = () => sortedWorkers().filter(worker => worker.active);
  const earliestStart = () => latest() ? shiftDay(latest().date,1) : '';
  function resetPeriod() {
    ({start,date} = defaultPeriodDates(today,latest()?.date));
    days = periodDays(date,latest(),data.workers,start);
    selectedDays = new Set();
    amount = '';
  }
  resetPeriod();
  if (data.draft) {
    ({date, days, amount} = data.draft);
    start = data.draft.start ?? days[0].date;
    const active = new Set(activeWorkers().map(worker => worker.id));
    for (const day of days) day.entries = day.entries.filter(row => active.has(row.id));
    sync.textContent = ' · Esborrany recuperat';
  }

  function saveDraft() {
    if (savingDraft || !pendingDraft) return savingDraft;
    sync.textContent = ' · Desant l’esborrany…';
    savingDraft = (async () => {
      let snapshot;
      try {
        while (pendingDraft) {
          snapshot = pendingDraft;
          pendingDraft = undefined;
          const result = await request({...snapshot, action:'draft', revision});
          revision = result.revision;
        }
        sync.textContent = ' · Esborrany desat';
        return true;
      } catch (error) {
        pendingDraft ??= snapshot;
        sync.textContent = ' · '+(error.message || 'No s’ha pogut desar l’esborrany.');
        return false;
      } finally {
        savingDraft = undefined;
      }
    })();
    return savingDraft;
  }

  function queueDraft() {
    pendingDraft = structuredClone({start, date, days, amount, previousDate:latest()?.date ?? null});
    void saveDraft();
  }

  window.addEventListener('online', () => { void saveDraft(); });
  window.addEventListener('beforeunload', event => {
    if (!savingDraft && !pendingDraft) return;
    event.preventDefault();
    event.returnValue = '';
  });

  const summary = rows => payoutSummary(rows,nameOf);

  function updateResult() {
    if (!get('result')) return;
    const cents = parseCents(amount);
    const invalidPoints = days.some(day => day.open && day.entries.some(row => !validUnits(row.units)));
    const {units, payouts} = distribute(cents ?? 0, days);
    get('total-points').textContent = formatPoints(units);
    get('per-point').textContent = units && cents !== null ? formatMoney(cents * 4 / units) : '—';
    get('result').innerHTML = invalidPoints
      ? '<p class="error">Introdueix punts positius o zero, amb fins a sis decimals.</p>'
      : cents === null ? '<p class="meta">Introdueix el pot per veure els imports.</p>' : summary(payouts);
    if (get('close-period')) get('close-period').disabled = busy || invalidPoints || cents === null || (!units && cents > 0) || !days.some(day => day.open);
  }

  function renderDay(day, index) {
    const label = dayLabel.format(dayOf(day.date));
    const available = activeWorkers().filter(worker => !day.entries.some(row => row.id === worker.id));
    return '<details class="tip-day" data-day="'+index+'" '+(selectedDays.has(day.date) ? 'open' : '')+'>'+
      '<summary><strong>'+label+'</strong><span class="meta">'+(day.open ? day.entries.length+' persones' : 'Tancat')+'</span></summary>'+
      '<label class="opening"><input type="checkbox" data-open="'+index+'" '+(day.open ? 'checked' : '')+'> Restaurant obert</label>'+
      (day.open ? day.entries.slice().sort((a, b) => collator.compare(nameOf(a.id), nameOf(b.id))).map(row =>
        // Lliscar cap a l'esquerra treu la persona d'aquest dia (sense confirmació i amb Desfés).
        swipeOpen('entry:'+index+':'+row.id,true,false)+'<div class="assignment swipe-row"><span>'+escapeHtml(nameOf(row.id))+'</span>'+
        '<div class="points-control"><input type="text" inputmode="decimal" maxlength="32" aria-label="Punts de '+escapeHtml(nameOf(row.id))+'" data-points="'+row.id+'" data-index="'+index+
        '" value="'+escapeHtml(row.text ?? (row.units === null ? '' : String(row.units / 4)).replace('.', ','))+'"><span class="point-arrows">'+
        '<button type="button" data-point-step="1" aria-label="Puja 0,25 punts a '+escapeHtml(nameOf(row.id))+'">▴</button>'+
        '<button type="button" data-point-step="-1" aria-label="Baixa 0,25 punts a '+escapeHtml(nameOf(row.id))+'">▾</button>'+
        '</span></div></div></div>'
      ).join('')+(available.length ? '<label class="add-worker">Afegeix un treballador<select data-add="'+index+'"><option value="">Tria una persona</option>'+
        available.map(worker => '<option value="'+worker.id+'">'+escapeHtml(worker.name)+'</option>').join('')+'</select></label>' : '') : '')+
      '</details>';
  }

  function renderHistory() {
    const result = renderTipsHistory(data,historyYear,today);
    historyYear = result.year;
    return result.html;
  }

  function render() {
    const tabList = limited && !can.history ? [] : [['period','Repartiment'],['history','Històric']];
    get('tabs').innerHTML = tabList.map(([key, label]) =>
      '<button type="button" data-tab="'+key+'" '+(tab === key ? 'aria-current="page"' : '')+'>'+label+'</button>').join('');
    if (tab === 'period') {
      const locked = limited ? ' disabled' : '';
      const amountField = !limited || can.pot ? '<input id="amount" type="text" inputmode="decimal" maxlength="32" placeholder="0,00" value="'+escapeHtml(amount)+'">'
        : '<input type="text" value="'+escapeHtml(amount)+'" readonly>';
      content.innerHTML = '<section class="card main-card"><h2>Repartiment</h2><section class="card"><h3>Dates i pot de propines</h3><div class="grid period-fields">'+
        '<label>Data inicial<input id="period-start" type="date" value="'+start+'" min="'+earliestStart()+'"'+locked+'></label>'+
        '<label>Data final<input id="period-date" type="date" value="'+date+'" min="'+start+'"'+locked+'></label>'+
        (!limited || can.pot || can.view ? '<label>Pot de propines (€)'+amountField+'</label>' : '')+'</div>'+
        (limited ? '<p class="meta">Pots marcar els dies oberts i els punts de cada treballador. Les dates i el tancament els fa l’administrador.</p>' : '')+
        '</section>'+
        '<section class="card"><h3>Dies i treballadors</h3>'+
        (!activeWorkers().length ? '<p class="meta">Afegeix persones a GestoAdmin per començar.</p>' : '')+
        days.map(renderDay).join('')+'</section>'+
        (!limited || can.view ? '<section class="card"><h3>Resultat</h3>'+
        '<div class="result-meta"><div><span>Parts totals</span><strong id="total-points"></strong></div>'+
        '<div><span>Valor per punt</span><strong id="per-point"></strong></div></div>'+
        '<div id="result"></div>'+(limited ? '' : '<button id="close-period" class="primary" type="button">Tanca el repartiment</button>')+'</section>' : '')+'</section>';
      updateResult();
    } else {
      content.innerHTML = renderHistory();
    }
  }

  async function save(body, callback, message) {
    if (busy) return;
    busy = true;
    content.inert = true;
    status.classList.remove('error');
    status.textContent = 'Desant…';
    try {
      if (body.action === 'close') {
        const saved = await saveDraft();
        if (saved === false) throw new Error('L’esborrany no està desat. Revisa l’avís al costat de la versió.');
        body.revision = revision;
      }
      await request(body);
      if (body.action === 'close') {
        revision = 0;
        sync.textContent = '';
      }
      data = await request();
      callback?.();
      status.classList.remove('error');
      status.textContent = message;
    } catch (error) {
      status.classList.add('error');
      status.textContent = error.message;
    } finally {
      busy = false;
      content.inert = false;
      render();
    }
  }

  get('tabs').addEventListener('click', event => {
    const button = event.target.closest('[data-tab]');
    if (!button || busy) return;
    tab = button.dataset.tab;
    menu.hidden = true;
    toggle.setAttribute('aria-expanded','false');
    render();
  });
  content.addEventListener('toggle', event => {
    const index = event.target.dataset.day;
    if (index === undefined || !days[index]) return;
    if (event.target.open) selectedDays.add(days[index].date);
    else selectedDays.delete(days[index].date);
  }, true);
  content.addEventListener('input', event => {
    const field = event.target;
    if (field.dataset.points) {
      const row = days[field.dataset.index].entries.find(entry => entry.id === field.dataset.points);
      const value = field.value.trim();
      row.text = field.value;
      row.units = /^\d{1,6}(?:[.,]\d{1,6})?$/.test(value) ? Math.round(Number(value.replace(',', '.')) * 1000000) / pointScale : null;
      updateResult();
      queueDraft();
    } else if (field.id === 'amount') {
      amount = event.target.value;
      updateResult();
      queueDraft();
    }
  });
  content.addEventListener('change', event => {
    const field = event.target;
    const {open, add} = field.dataset;
    if (field.id === 'period-start' || field.id === 'period-date') {
      const changingStart = field.id === 'period-start';
      const chosen = field.value;
      const nextStart = changingStart ? chosen : start;
      const nextEnd = changingStart ? (chosen > date ? chosen : date) : chosen;
      if (!validPeriodRange(nextStart,nextEnd,latest()?.date)) {
        field.value = changingStart ? start : date;
        status.classList.add('error');
        status.textContent = 'Tria un període de fins a 366 dies, posterior a l’últim repartiment. La data final ha de ser igual o posterior a la inicial.';
        return;
      }
      const existing = new Map(days.map(day => [day.date,day]));
      start = nextStart;
      date = nextEnd;
      days = periodDays(date,latest(),data.workers,start).map(day => existing.get(day.date) ?? day);
      status.classList.remove('error');
      status.textContent = '';
    } else if (open !== undefined) {
      days[open].open = field.checked;
    } else if (add !== undefined && field.value) {
      const day = days[add];
      const {matching, previous} = suggestedPoints(field.value, day.date, days, data.periods);
      day.entries.push({id:field.value, units:matching ?? previous ?? null});
    } else {
      return;
    }
    queueDraft();
    render();
  });
  function stepPoints(field, step) {
    const row = days[field.dataset.index].entries.find(entry => entry.id === field.dataset.points);
    const scaled = Math.round((row.units ?? 0) * pointScale);
    const next = Math.min(Math.round(maxUnits * pointScale), Math.max(0, scaled + step * pointScale));
    field.value = String(next / (4 * pointScale)).replace('.', ',');
    field.dispatchEvent(new Event('input', {bubbles:true}));
  }

  content.addEventListener('keydown', event => {
    if (!event.target.dataset.points || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    stepPoints(event.target, event.key === 'ArrowUp' ? 1 : -1);
  });
  content.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || busy) return;
    const {historyYear:year, pointStep} = button.dataset;
    if (year) {
      historyYear = year;
      render();
      content.querySelector('[data-history-year="'+year+'"]').focus();
    } else if (pointStep) {
      stepPoints(button.closest('.points-control').querySelector('input'), Number(pointStep));
    } else if (button.id === 'close-period') {
      const cents = parseCents(amount);
      if (!confirm('Tancar el repartiment de '+formatMoney(cents)+'?')) return;
      void save({action:'close', start, date, cents, days:days.map(day => day.open ? day : {...day, entries:[]}), previousDate:latest()?.date ?? null}, () => {
        resetPeriod();
        tab = 'history';
      }, 'S’ha tancat el repartiment.');
    }
  });
  // Treure una persona d'un dia lliscant-la cap a l'esquerra. «Desfés» la torna al mateix lloc, amb els mateixos punts.
  setupSwipe((key, dir) => {
    const [kind, index, id] = key.split(':');
    const day = days[index];
    const position = day?.entries.findIndex(row => row.id === id) ?? -1;
    if (kind !== 'entry' || dir !== 'left' || busy || position < 0) return false;
    const [removed] = day.entries.splice(position,1);
    queueDraft();
    render();
    showUndo('S’ha tret '+nameOf(id)+' del '+dayLabel.format(dayOf(day.date))+'.',() => {
      if (!days.includes(day) || day.entries.some(row => row.id === id)) return;
      day.entries.splice(Math.min(position,day.entries.length),0,removed);
      queueDraft();
      render();
    });
    return true;
  },() => busy);
  render();
}

import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendEmailVerification, sendPasswordResetEmail, signOut, reload, checkActionCode, applyActionCode, verifyPasswordResetCode, confirmPasswordReset
} from 'https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js';

async function startStaffApp(apiOrigin, mountApp, apiPath = "/api") {
  const panel = document.querySelector('#login-panel');
  const form = document.querySelector('#login-form');
  const message = document.querySelector('#login-status');
  const actions = document.querySelector('#verify-actions');
  const repair = document.querySelector('#verify-link-form');
  const resetPanel = document.querySelector('#reset-panel');
  const resetForm = document.querySelector('#reset-link-form');
  const logout = document.querySelector('#logout');
  const workspace = document.querySelector('#workspace');
  let auth;
  let mounted = false;
  let busy = false;
  const emailAction = new URL(location.href);
  const incomingMode = emailAction.searchParams.get('mode');
  let actionMode = ['verifyEmail','resetPassword'].includes(incomingMode) && emailAction.searchParams.get('oobCode') ? incomingMode : '';
  if (actionMode) history.replaceState(null,'',location.pathname);

  function show(text) {
    message.textContent = text;
  }

  function errorMessage(error) {
    switch (error.code) {
      case 'auth/invalid-credential': return 'El correu o la contrasenya no són correctes.';
      case 'auth/email-already-in-use': return 'Aquest correu ja té compte. Inicia sessió o restableix la contrasenya.';
      case 'auth/weak-password': return 'Tria una contrasenya d’almenys sis caràcters.';
      case 'auth/too-many-requests': return 'Massa intents. Torna-ho a provar més tard.';
      default: return error.status ? error.message : 'No hi ha connexió amb el servei d’accés. Torna-ho a provar.';
    }
  }

  async function request(body) {
    const token = await auth.currentUser?.getIdToken();
    if (!token) throw Object.assign(new Error('Torna a iniciar sessió.'),{status:401});
    const headers = {Authorization:'Bearer '+token};
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(apiOrigin+apiPath,{method:body ? 'POST' : 'GET',headers,
      body:body ? JSON.stringify(body) : undefined,cache:'no-store',credentials:'omit'});
    const result = await response.json();
    if (!response.ok) throw Object.assign(new Error(result.error),{status:response.status});
    return result;
  }

  async function enter(user) {
    form.hidden = Boolean(user);
    resetPanel.hidden = Boolean(user);
    actions.hidden = !user;
    repair.hidden = !user || user.emailVerified;
    logout.hidden = !user;
    if (!user) {
      show('');
      return;
    }
    show('Comprovant l’accés…');
    try {
      const data = await request();
      if (auth.currentUser?.uid !== user.uid || mounted) return;
      mounted = true;
      panel.hidden = true;
      workspace.hidden = false;
      mountApp(request,data);
    } catch (error) {
      document.querySelector('#resend-verification').hidden = user.emailVerified;
      show(errorMessage(error));
    }
  }

  async function withFeedback(operation) {
    if (busy) return;
    busy = true;
    try { await operation(); }
    catch (error) { show(errorMessage(error)); }
    finally { busy = false; }
  }

  try {
    const response = await fetch(apiOrigin+'/auth-config',{cache:'no-store',credentials:'omit'});
    if (!response.ok) throw new Error('Firebase configuration unavailable');
    // Own Firebase app name so GestoTips keeps its session separate from GestoCatalog
    // (both share the same origin, jninforner.github.io, and the same Firebase project).
    auth = getAuth(initializeApp(await response.json(),'gestotips'));
    auth.languageCode = 'ca';
  } catch {
    show('L’accés de l’equip no està disponible. Torna-ho a provar més tard.');
    form.hidden = true;
    resetPanel.hidden = true;
    return;
  }

  const emailField = form.elements.email;
  form.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const email = emailField.value.trim();
      const password = form.elements.password.value;
      if (event.submitter?.value === 'register') {
        const {user} = await createUserWithEmailAndPassword(auth,email,password);
        await sendEmailVerification(user);
        show('T’hem enviat un correu de verificació. Obre’l i torna aquí per continuar.');
      } else {
        await signInWithEmailAndPassword(auth,email,password);
      }
      form.reset();
    });
  });

  function emailActionCode(value, mode) {
    try {
      const link = new URL(value.trim());
      if (((link.origin === 'https://'+auth.app.options.authDomain && link.pathname === '/__/auth/action') ||
           (link.origin === 'https://jninforner.github.io' && ['/GestoTips/','/GestoCatalog/','/GestoComandes/','/NexaTips/','/NexaComandes/','/tracacomandes/'].includes(link.pathname))) && link.searchParams.get('mode') === mode) {
        return link.searchParams.get('oobCode');
      }
    } catch {
      return null;
    }
    return null;
  }

  resetForm.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const code = emailActionCode(resetForm.elements.link.value,'resetPassword');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de restabliment de contrasenya de GestoTips.');
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth,code);
        await confirmPasswordReset(auth,code,resetForm.elements.password.value);
        resetForm.reset();
        resetForm.elements.link.closest('label').hidden = false;
        resetPanel.open = false;
        if (actionMode) {
          actionMode = '';
          if (auth.currentUser) await signOut(auth);
          await enter(null);
        }
        emailField.value = email;
        form.elements.password.value = '';
        form.elements.password.focus();
        show('Contrasenya desada. Ja pots entrar amb la nova.');
      } catch (error) {
        resetForm.elements.password.value = '';
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('Aquest enllaç ha caducat o ja s’ha utilitzat. Demana’n un de nou amb «He oblidat la contrasenya».');
        } else {
          throw error;
        }
      }
    });
  });

  document.querySelector('#password-reset').onclick = event => {
    event.preventDefault();
    void withFeedback(async () => {
      if (!emailField.reportValidity()) return;
      await sendPasswordResetEmail(auth,emailField.value.trim());
      show('Si existeix un compte amb aquest correu, rebràs un enllaç per restablir la contrasenya.');
    });
  };

  document.querySelector('#retry-login').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await reload(auth.currentUser);
    if (!auth.currentUser) return;
    await auth.currentUser.getIdToken(true);
    await enter(auth.currentUser);
  });

  document.querySelector('#resend-verification').onclick = () => withFeedback(async () => {
    if (!auth.currentUser) return;
    await sendEmailVerification(auth.currentUser);
    show('T’hem tornat a enviar el correu de verificació.');
  });

  repair.addEventListener('submit',event => {
    event.preventDefault();
    void withFeedback(async () => {
      const user = auth.currentUser;
      if (!user && actionMode !== 'verifyEmail') return;
      const code = emailActionCode(repair.elements.link.value,'verifyEmail');
      if (!code) {
        show('Enganxa l’enllaç complet del correu de verificació de GestoCatalog.');
        return;
      }
      try {
        const info = await checkActionCode(auth,code);
        if (info.operation !== 'VERIFY_EMAIL' || (user && actionMode !== 'verifyEmail' && info.data.email?.toLowerCase() !== user.email?.toLowerCase())) {
          show('Aquest enllaç correspon a un altre compte.');
          return;
        }
        await applyActionCode(auth,code);
        repair.reset();
        actionMode = '';
        if (user && info.data.email?.toLowerCase() === user.email?.toLowerCase()) {
          await reload(user);
          await user.getIdToken(true);
          await enter(user);
        } else {
          if (user) await signOut(auth);
          await enter(null);
          emailField.value = info.data.email || '';
          show('Correu verificat. Ja pots iniciar sessió.');
        }
      } catch (error) {
        if (['auth/invalid-action-code','auth/expired-action-code'].includes(error.code)) {
          show('L’enllaç ha caducat o ja s’ha utilitzat. Prem «Comprova l’accés» o demana un correu nou.');
        } else {
          throw error;
        }
      }
    });
  });

  logout.onclick = () => withFeedback(async () => {
    await signOut(auth);
    location.reload();
  });

  if (actionMode) {
    form.hidden = true;
    resetPanel.hidden = actionMode !== 'resetPassword';
    resetPanel.open = !resetPanel.hidden;
    repair.hidden = actionMode !== 'verifyEmail';
    const current = resetPanel.hidden ? repair : resetForm;
    current.elements.link.value = emailAction.href;
    current.elements.link.closest('label').hidden = true;
    show(actionMode === 'resetPassword' ? 'Tria una contrasenya nova.' : 'Prem el botó per confirmar el correu.');
  }

  onAuthStateChanged(auth,user => {
    if (actionMode) return;
    if (mounted && !user) location.reload();
    else if (!mounted) void enter(user);
  });
}

startStaffApp(location.hostname === "jninforner.github.io" ? "https://gesto-apps.jninforner.workers.dev" : location.origin, mountApp, "/NexaTips/api");
</script>
